<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My list and weekly journal · Throwaway Sample</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f5ef; color: #20352a; font: 17px/1.5 system-ui, sans-serif; }
    main { max-width: 700px; margin: 8vh auto; padding: 32px; }
    h1 { margin: 0; font-size: 42px; letter-spacing: -2px; }
    h2 { margin-top: 40px; }
    p { color: #59665d; }
    label { display: block; margin: 16px 0 8px; font-weight: 600; }
    form > div { display: flex; flex-direction: column; gap: 10px; }
    input, textarea { width: 100%; border: 1px solid #aab6ac; border-radius: 10px; padding: 12px; font: inherit; }
    textarea { min-height: 260px; resize: vertical; }
    button { border: 0; border-radius: 10px; padding: 12px 18px; background: #275d43; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #18462f; }
    :focus-visible { outline: 3px solid #ba790b; outline-offset: 3px; }
    ul { list-style: none; padding: 0; margin: 24px 0; }
    li { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid #d6ddd4; }
    li span { flex: 1; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    li button { padding: 8px 12px; background: #f0dfdc; color: #803b31; }
    li button:hover { background: #e5c9c3; }
    .metadata { font-size: 14px; color: #59665d; }
    #status, #journal-status { min-height: 26px; font-size: 14px; }
    @media (max-width: 480px) { main { margin: 5vh auto; padding: 24px; } }
  </style>
</head>
<body>
  <main>
    <h1>My list</h1>
    <p>A little place for your items. Saved in this browser.</p>
    <form id="form">
      <label for="item">Add an item</label>
      <div>
        <input id="item" autocomplete="off" placeholder="What would you like to add?" required>
        <label for="details">Details (optional)</label>
        <input id="details" autocomplete="off" placeholder="Add details for this item">
        <button>Add</button>
      </div>
    </form>
    <ul id="list" aria-label="Your items"></ul>
    <p id="status" role="status"></p>

    <h2>Weekly journal</h2>
    <p>Write about your progress. Your journal is saved in this browser.</p>
    <form id="journal-form">
      <label for="week">Week or journal title</label>
      <input id="week" placeholder="Week of 14–20 October 2026" required>
      <label for="written">Date written</label>
      <input id="written" type="date" required>
      <label for="entry">Your progress</label>
      <textarea id="entry" placeholder="What did you work on, learn, or find challenging?" required></textarea>
      <button>Save journal entry</button>
    </form>
    <p class="metadata" id="journal-metadata"></p>
    <p id="journal-status" role="status"></p>
  </main>
  <script>
    const key = 'throwaway-sample-items', journalKey = 'throwaway-sample-journal';
    const input = document.querySelector('#item'), details = document.querySelector('#details');
    const list = document.querySelector('#list'), status = document.querySelector('#status');
    let items = [], storageAvailable = true;
    try {
      const saved = JSON.parse(localStorage.getItem(key) || '[]');
      if (Array.isArray(saved) && saved.every(item => typeof item === 'string')) items = saved;
    } catch { storageAvailable = false; }
    function render() {
      list.replaceChildren();
      items.forEach((item, index) => {
        const row = document.createElement('li'), text = document.createElement('span'), button = document.createElement('button');
        text.textContent = item; button.textContent = 'Delete'; button.setAttribute('aria-label', `Delete ${item}`);
        button.addEventListener('click', () => { items.splice(index, 1); save(); (list.children[index]?.querySelector('button') || input).focus(); });
        row.append(text, button); list.append(row);
      });
      status.textContent = storageAvailable ? (items.length ? `${items.length} item${items.length === 1 ? '' : 's'} · Saved in this browser` : 'Your list is empty. Add your first item above.') : 'Browser storage is unavailable.';
    }
    function save() {
      try { localStorage.setItem(key, JSON.stringify(items)); storageAvailable = true; } catch { storageAvailable = false; }
      render();
    }
    document.querySelector('#form').addEventListener('submit', event => {
      event.preventDefault(); const item = input.value.trim(); if (!item) { input.focus(); return; }
      items.push([item, details.value.trim()].filter(Boolean).join('\n')); input.value = ''; details.value = ''; save(); input.focus();
    });

    const week = document.querySelector('#week'), written = document.querySelector('#written'), entry = document.querySelector('#entry');
    const journalMetadata = document.querySelector('#journal-metadata'), journalStatus = document.querySelector('#journal-status');
    const now = new Date(), today = now.toISOString().slice(0, 10);
    written.value = today;
    function showJournal() {
      try {
        const saved = JSON.parse(localStorage.getItem(journalKey) || 'null');
        if (saved && saved.title && saved.entry) {
          week.value = saved.title; written.value = saved.written || today; entry.value = saved.entry;
          journalMetadata.textContent = `Added ${saved.added} · Last saved ${saved.saved}`;
        }
      } catch { journalStatus.textContent = 'Saved journal data could not be loaded.'; }
    }
    document.querySelector('#journal-form').addEventListener('submit', event => {
      event.preventDefault();
      const saved = JSON.parse(localStorage.getItem(journalKey) || 'null'), stamp = new Date().toLocaleString();
      const journal = { title: week.value.trim(), written: written.value, entry: entry.value.trim(), added: saved?.added || stamp, saved: stamp };
      if (!journal.title || !journal.entry) return;
      try { localStorage.setItem(journalKey, JSON.stringify(journal)); journalMetadata.textContent = `Added ${journal.added} · Last saved ${journal.saved}`; journalStatus.textContent = 'Journal entry saved.'; }
      catch { journalStatus.textContent = 'Browser storage is unavailable.'; }
    });
    render(); showJournal();
  </script>
</body>
</html>
