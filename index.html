<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My list · Throwaway Sample</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at top, #fce9e7, transparent 65%), #faf8f7; color: #292323; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 620px; margin: 8vh auto; padding: 40px; background: #fff; border: 1px solid #eee3e1; border-radius: 24px; box-shadow: 0 20px 60px #6327200d; }
    h1 { margin: 0; font-size: clamp(36px, 7vw, 48px); line-height: 1.15; letter-spacing: -2px; }
    h1::before { content: 'YOUR EVERYDAY SPACE'; display: block; margin-bottom: 14px; color: #b42332; font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    p { margin: 14px 0 28px; color: #716464; }
    label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 650; }
    form > div { display: flex; flex-direction: column; gap: 10px; }
    input { width: 100%; min-width: 0; border: 1px solid #dfd5d3; border-radius: 12px; padding: 14px 16px; background: #fcfaf9; color: inherit; font: inherit; }
    input::placeholder { color: #80716e; } input:focus { border-color: #b42332; background: #fff; }
    button { border: 0; border-radius: 12px; padding: 14px 18px; background: #b42332; color: white; font: inherit; font-weight: 650; cursor: pointer; }
    form button { margin-top: 8px; } button:hover { background: #941b28; } button:active { transform: translateY(1px); }
    :focus-visible { outline: 3px solid #b42332; outline-offset: 3px; }
    ul { list-style: none; padding: 0; margin: 28px 0 16px; display: grid; gap: 10px; }
    li { display: flex; align-items: center; gap: 16px; padding: 16px; background: #fcfaf9; border: 1px solid #eee3e1; border-radius: 14px; }
    li span { flex: 1; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    li button { flex-shrink: 0; padding: 8px 12px; background: #fbe9e8; color: #a11e2b; font-size: 13px; }
    li button:hover { background: #f5d6d3; }
    #status { min-height: 26px; margin: 0; color: #716464; font-size: 12px; text-align: center; }
    @media (max-width: 480px) { main { margin: 24px 16px; padding: 24px; border-radius: 20px; } li { gap: 10px; padding: 12px; } }
  </style>
</head>
<body>
  <main>
    <h1>My list</h1>
    <p>A little place for your items. Saved in this browser.</p>
    <form id="form">
      <label for="item">Add an item</label>
      <div>
        <input id="item" autocomplete="off" placeholder="What would you like to add?" required>
        <label for="details">Details (optional)</label>
        <input id="details" autocomplete="off" placeholder="Add details for this item">
        <button>Add</button>
      </div>
    </form>
    <ul id="list" aria-label="Your items"></ul>
    <p id="status" role="status"></p>
  </main>
  <script>
    const key = 'throwaway-sample-items';
    const input = document.querySelector('#item');
    const details = document.querySelector('#details');
    const list = document.querySelector('#list');
    const status = document.querySelector('#status');
    let items = [], storageAvailable = true;
    try {
      const saved = JSON.parse(localStorage.getItem(key) || '[]');
      if (Array.isArray(saved) && saved.every(item => typeof item === 'string')) items = saved;
    } catch { storageAvailable = false; }
    function render() {
      list.replaceChildren();
      items.forEach((item, index) => {
        const row = document.createElement('li');
        const text = document.createElement('span');
        const button = document.createElement('button');
        text.textContent = item;
        button.textContent = 'Delete';
        button.setAttribute('aria-label', `Delete ${item}`);
        button.addEventListener('click', () => {
          items.splice(index, 1);
          save();
          (list.children[index]?.querySelector('button') || input).focus();
        });
        row.append(text, button);
        list.append(row);
      });
      status.textContent = storageAvailable
        ? (items.length ? `${items.length} item${items.length === 1 ? '' : 's'} · Saved in this browser` : 'Your list is empty. Add your first item above.')
        : 'Browser storage is unavailable. Changes will be lost when you close or refresh this page.';
    }
    function save() {
      try { localStorage.setItem(key, JSON.stringify(items)); storageAvailable = true; }
      catch { storageAvailable = false; }
      render();
    }
    document.querySelector('#form').addEventListener('submit', event => {
      event.preventDefault();
      const item = input.value.trim();
      if (!item) { input.focus(); return; }
      items.push([item, details.value.trim()].filter(Boolean).join('\n'));
      input.value = '';
      details.value = '';
      save();
      input.focus();
    });
    render();
  </script>
</body>
</html>
